<!DOCTYPE html>
<html>
<head>
    <title>TOPSIS – Model Ranking</title>
</head>
<body>

<h2>TOPSIS Model Ranking</h2>

<form method="POST" enctype="multipart/form-data">

    <label>Upload CSV file:</label><br>
    <input type="file" name="file" required><br><br>

    <label>Weights (comma separated):</label><br>
    <input type="text" name="weights" placeholder="5,3,2" required><br><br>

    <label>Impacts (comma separated):</label><br>
    <input type="text" name="impacts" placeholder="+,-,-" required><br><br>

    <label>Email address:</label><br>
    <input type="email" name="email" required><br><br>

    <button type="submit">Run TOPSIS</button>

</form>

</body>
</html>
